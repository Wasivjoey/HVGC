# Render.com Blueprint for HVGC LINEUP.
# In the Render dashboard: New → Blueprint, point it at this repo, and Render
# will create the Postgres database and the web service from this file.
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: hvgc-lineup-db
    databaseName: lineup
    user: lineup
    plan: free            # free Postgres (upgrade to 'basic-256mb'+ for production)

services:
  - type: web
    name: hvgc-lineup
    runtime: python
    plan: free            # free web instance (sleeps when idle; upgrade for always-on + disk)
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn 'app:create_app()' --bind 0.0.0.0:$PORT --workers 2 --timeout 60"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Session signing key — Render generates a strong random value once.
      - key: SECRET_KEY
        generateValue: true
      # Postgres connection string, injected from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: hvgc-lineup-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.7"

      # ---- WA Scheduler (WhatsApp group post scheduler) ----
      # URL the admin sidebar "WA Scheduler" link points to. This blueprint
      # deploys the scheduler as its own service (hvgc-wa-scheduler, below), so
      # point the link at that service's public URL. Render's default domain is
      # <service-name>.onrender.com; if that name is already taken Render appends
      # a random suffix — update this value to the real URL after the first
      # deploy (Dashboard -> hvgc-wa-scheduler -> the https:// link at the top).
      # Set empty to hide the sidebar link.
      - key: WA_SCHEDULER_URL
        value: "https://hvgc-wa-scheduler.onrender.com"

      # Uploaded avatars & programme documents are stored IN THE DATABASE, so
      # they survive every deploy on the free plan — no persistent disk needed.
      # UPLOAD_PATH is only a scratch dir for processing and can stay unset.
      # - key: UPLOAD_PATH
      #   value: /var/data/uploads
      # Max size (MB) of a document stored in the DB. Avatars are always tiny
      # (downscaled to a small JPEG). Lower this to save room on a small database.
      # - key: MAX_DOC_MB
      #   value: "5"

      # ---- Email for verification, password reset & schedule invites ----
      # Without any of these, the app shows verification/reset links on screen.
      #
      # RECOMMENDED on Render: Brevo's transactional email API. It sends over
      # HTTPS (port 443), so it works on every plan — Render blocks outbound
      # SMTP ports (25/465/587) on free instances. Create a key at
      # brevo.com -> SMTP & API -> API Keys, and verify your sender address.
      # - key: BREVO_API_KEY
      #   sync: false        # set as a secret in the dashboard
      # - key: SMTP_FROM
      #   value: no-reply@yourchurch.org   # a Brevo-verified sender address
      # - key: EMAIL_FROM_NAME
      #   value: HVGC LINEUP
      #
      # Alternative: classic SMTP (needs a PAID Render instance — SMTP ports are
      # blocked on free web services). Leave BREVO_API_KEY unset to use this.
      #
      # Gmail example: SMTP_USER is your full Gmail address and SMTP_PASSWORD is
      # a Google *App Password* (16 chars, needs 2-Step Verification on) — NOT
      # your normal password. SMTP_FROM must equal the Gmail address (or a
      # "Send mail as" alias you've verified). ~500 emails/day limit.
      # - key: SMTP_HOST
      #   value: smtp.gmail.com
      # - key: SMTP_PORT
      #   value: "587"          # STARTTLS. Use "465" for implicit SSL.
      # - key: SMTP_USER
      #   value: yourname@gmail.com
      # - key: SMTP_PASSWORD
      #   sync: false           # the App Password — set as a secret in the dashboard
      # - key: SMTP_FROM
      #   value: yourname@gmail.com
      # - key: EMAIL_FROM_NAME
      #   value: HVGC LINEUP

      # ---- Automatic 36h serving reminders ----
      # The app sends each volunteer a reminder ~36h before they serve. A
      # scheduler must call GET /tasks/service-reminders hourly with this secret.
      # Set CRON_SECRET here, then add a Render Cron Job (see the services list
      # below or the dashboard) that runs, e.g. hourly:
      #   curl -fsS "https://YOUR-APP.onrender.com/tasks/service-reminders?key=$CRON_SECRET"
      # - key: CRON_SECRET
      #   generateValue: true        # or set your own secret
      # - key: SERVICE_REMINDER_HOURS
      #   value: "36"
      # Church timezone for timing reminders (an admin can also set it in-app on
      # the Settings page). IANA name, e.g. Africa/Lagos, America/New_York.
      # - key: TIMEZONE
      #   value: "UTC"

      # ---- Optional AI auto-scheduler ----
      # Set an Anthropic API key to enable the "Use AI assistant" option when
      # generating a service roster. Without it the rules-based auto-scheduler
      # is used (always available). Outbound HTTPS to api.anthropic.com works on
      # all Render plans (it's port 443, not a blocked SMTP port).
      # - key: ANTHROPIC_API_KEY
      #   sync: false        # set as a secret in the dashboard
      # - key: AUTOSCHEDULE_MODEL
      #   value: claude-sonnet-5

    # ---- Optional persistent disk for uploaded files (paid plans only) ----
    # Uncomment this AND the UPLOAD_PATH env var above to keep uploaded
    # documents/avatars across deploys. mountPath must be the parent of UPLOAD_PATH.
    # disk:
    #   name: lineup-data
    #   mountPath: /var/data
    #   sizeGB: 1

  # ---- WA Scheduler: Node + Baileys WhatsApp group post scheduler ----
  # A long-running always-on service. It MUST NOT sleep: the scheduler polls
  # for due posts in-process, so an idle/sleeping free instance would miss
  # them. It also needs a persistent disk — the SQLite DB, the WhatsApp login
  # (Baileys auth), and uploaded media all live on disk, and without the disk
  # every deploy wipes them (you'd re-scan the QR and lose scheduled posts).
  # NOTE: automating WhatsApp via Baileys is against WhatsApp's Terms of
  # Service and can get the number banned. Keep volume low and human-like.
  - type: web
    name: hvgc-wa-scheduler
    runtime: node
    plan: starter         # always-on; do NOT use 'free' (it sleeps -> missed posts)
    region: oregon
    branch: main
    rootDir: wa-scheduler
    buildCommand: "npm ci"
    startCommand: "npm start"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Pin the runtime: the app uses node:sqlite (DatabaseSync), which needs a
      # recent Node. This matches the version it was built and tested against.
      - key: NODE_VERSION
        value: "26.13.0"
      # Dashboard login password — set as a secret in the dashboard, do NOT
      # commit it. Without it the app falls back to the insecure default.
      - key: DASHBOARD_PASSWORD
        sync: false
      # Session cookie signing key — Render generates a strong random value.
      - key: SESSION_SECRET
        generateValue: true
      # Point the data + uploads dirs at the persistent disk (mounted below) so
      # the DB, WhatsApp sessions, and media survive restarts and deploys.
      - key: DATA_DIR
        value: /var/wa-data/data
      - key: UPLOADS_DIR
        value: /var/wa-data/uploads
    disk:
      name: wa-data
      mountPath: /var/wa-data
      sizeGB: 1
