{# Drawn line-icon set (one consistent stroke, currentColor). Usage: {{ ic.icon('calendar') }} #}
{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'dashboard' %}<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{%- elif name == 'calendar' %}<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/>
{%- elif name == 'calendar-check' %}<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M9 15.5l2 2 4-4"/>
{%- elif name == 'availability' %}<rect x="3" y="4.5" width="18" height="17" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="12" cy="15.5" r="1.8"/>
{%- elif name == 'users' %}<path d="M16 20v-1.5a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4V20"/><circle cx="9.5" cy="7" r="3.5"/><path d="M21 20v-1.5a4 4 0 0 0-3-3.85M16.5 3.6a3.5 3.5 0 0 1 0 6.8"/>
{%- elif name == 'user' %}<circle cx="12" cy="8" r="4"/><path d="M5.5 20.5a6.5 6.5 0 0 1 13 0"/>
{%- elif name == 'home' %}<path d="M3.5 11 12 3.5l8.5 7.5"/><path d="M5.5 9.7V20h13V9.7"/><path d="M9.5 20v-5.5h5V20"/>
{%- elif name == 'sanctuary' %}<path d="M12 2.5v4M10 4.5h4"/><path d="M4 21V11l8-4.5 8 4.5v10"/><path d="M4 21h16"/><path d="M9.5 21v-4a2.5 2.5 0 0 1 5 0v4"/>
{%- elif name == 'swap' %}<path d="M16.5 3 20 6.5 16.5 10"/><path d="M4 7.5v-.5a2.5 2.5 0 0 1 2.5-2.5H20"/><path d="M7.5 21 4 17.5 7.5 14"/><path d="M20 16.5v.5a2.5 2.5 0 0 1-2.5 2.5H4"/>
{%- elif name == 'training' %}<path d="M12 4 2.5 8.5 12 13l9.5-4.5L12 4Z"/><path d="M6 10.5V16c0 1.4 2.7 2.8 6 2.8s6-1.4 6-2.8v-5.5"/><path d="M21.5 8.5v5"/>
{%- elif name == 'book' %}<path d="M5 4.5A2 2 0 0 1 7 2.5h12v16H7a2 2 0 0 0-2 2z"/><path d="M5 18.5A2 2 0 0 0 7 20.5h12"/>
{%- elif name == 'quiz' %}<circle cx="12" cy="12" r="9.2"/><path d="M9.3 9.2a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.4-2.7 3.8"/><path d="M12 17.3h.01"/>
{%- elif name == 'teams' %}<path d="M12 2.5 21 7l-9 4.5L3 7l9-4.5Z"/><path d="M3 12l9 4.5L21 12"/><path d="M3 16.8l9 4.5 9-4.5"/>
{%- elif name == 'roles' %}<path d="M5 21v-6M5 11V3M12 21v-9M12 8V3M19 21v-5M19 12V3M2.5 15h5M9.5 8h5M16.5 16h5"/>
{%- elif name == 'grid' %}<rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>
{%- elif name == 'megaphone' %}<path d="M3 11v2a1 1 0 0 0 1 1h2l5 4V6L6 10H4a1 1 0 0 0-1 1Z"/><path d="M11 6l8-3.5v19L11 18"/><path d="M6 14v3.5a1.5 1.5 0 0 0 3 0V18"/>
{%- elif name == 'poll' %}<path d="M3.5 21h17"/><path d="M6 21V10.5M11.5 21V4M17 21v-7"/>
{%- elif name == 'settings' %}<circle cx="12" cy="12" r="3"/><path d="M12 2.5v2.5M12 19v2.5M21.5 12H19M5 12H2.5M18.7 5.3l-1.8 1.8M7.1 16.9l-1.8 1.8M18.7 18.7l-1.8-1.8M7.1 7.1 5.3 5.3"/>
{%- elif name == 'bell' %}<path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5Z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/>
{%- elif name == 'bolt' %}<path d="M13 2.5 4.5 13.5H11l-1 8 8.5-11H12l1-8Z"/>
{%- elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>
{%- elif name == 'bell-reminder' %}<path d="M18 8.5a6 6 0 0 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5Z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/>
{%- elif name == 'check-shield' %}<path d="M12 2.5 4 5.5v6c0 5 3.5 8 8 10 4.5-2 8-5 8-10v-6l-8-3Z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == 'arrow-right' %}<path d="M5 12h14M13 6l6 6-6 6"/>
{%- else %}<circle cx="12" cy="12" r="9"/>
{%- endif %}
</svg>
{%- endmacro %}
